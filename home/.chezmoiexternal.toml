# Managed by chezmoi. Pinned versions are tracked by renovate (see renovate.json).

[".oh-my-zsh"]
    type = "archive"
    url = "https://github.com/ohmyzsh/ohmyzsh/archive/master.tar.gz"
    exact = false
    stripComponents = 1
    refreshPeriod = "168h"

# alien は libs/ に git submodule (promptlib / zsh-async / zsh-256color) を持つ。
# archive tarball は submodule を含まないためテーマが壊れる。git-repo + --recurse-submodules で取得する。
[".oh-my-zsh/custom/themes/alien"]
    type = "git-repo"
    url = "https://github.com/eendroroy/alien.git"
    refreshPeriod = "168h"
    # renovate: depName=eendroroy/alien
    clone.args = ["--branch", "2.1.2", "--depth", "1", "--recurse-submodules", "--shallow-submodules"]
    pull.args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/0.8.0.tar.gz"
    stripComponents = 1

[".oh-my-zsh/custom/plugins/zsh-completions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-completions/archive/refs/tags/0.36.0.tar.gz"
    stripComponents = 1

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-autosuggestions/archive/refs/tags/v0.7.1.tar.gz"
    stripComponents = 1

[".oh-my-zsh/custom/plugins/zsh-history-substring-search"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-history-substring-search/archive/refs/tags/v1.1.0.tar.gz"
    stripComponents = 1
