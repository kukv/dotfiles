# Managed by mise [dotfiles] — edit home/dot_config/mise/config.toml in kukv/dotfiles
# ==========================================================================
# settings
# ==========================================================================
[settings]
experimental = true
# .node-version 等の言語固有バージョンファイルを読まない (mise.toml で一元管理)
idiomatic_version_file_enable_tools = []
# token 無しの初回 bootstrap でも tools の版解決がタイムアウトしないよう延ばす (旧 Ansible role と同じ 60s)
fetch_remote_versions_timeout = "60s"

minimum_release_age_excludes = ["github:kukv/octoscope"]

[settings.github]
# gh はトークンを keyring に置くため hosts.yml に oauth_token が無く、mise の gh 連携
# (優先度 7) では取得できない。ドキュメント推奨どおり credential_command で取り出す。
# https://mise.jdx.dev/dev-tools/github-tokens.html
# mise bootstrap の定期実行は bootstrap.env の MISE_GITHUB_TOKEN (優先度 1) が勝つため、この設定は対話シェル用。
credential_command = "gh auth token"

[settings.npm]
package_manager = "pnpm"

[settings.pipx]
uvx = true

# ==========================================================================
# plugins
# ==========================================================================
[plugins]
# skill:<owner>/<repo> の backend。Claude Code のスキルを取得して ~/.claude/skills にリンクする
skill = "https://github.com/kukv/mise-skill#v0.1.1"

# ==========================================================================
# env
# ==========================================================================
[env]
# Ruby をソースからビルドせずプリコンパイル済みバイナリを使う
MISE_RUBY_COMPILE = "0"

# ==========================================================================
# packages
# ==========================================================================
[tools]
# [tools.jvm]
java = [
    "openjdk-25",
    "openjdk-21",
    "openjdk-17",
]
gradle = "latest"
maven = "latest"
kotlin = "latest"

# [tools.node]
node = [
    "24",
    "22",
]
pnpm = "latest"
bun = "latest"
"npm:yarn" = "latest"

# [tools.python]
python = "3.14"
uv = "latest"

# [tools.ruby]
ruby = [ "4", "3" ]

# [tools.go]
go = "latest"
golangci-lint = "latest"
gomigrate = "latest"
gotestsum = "latest"
skeema = "latest"
"go:golang.org/x/tools/cmd/godoc" = "latest"

# [tools.kubernetes]
kubectl = "latest"
helm = "latest"
helmfile = "latest"
k3d = "latest"
cmctl = "latest"
argo = "latest"
k9s = "latest"
kustomize = "latest"
kubeconform = "latest"
conftest = "latest"
flux2 = "latest"
stern = "latest"

# [tools.vcs]
github-cli = "latest"
lazygit = "latest"
act = "latest"
action-validator = "latest"
actionlint = "latest"
jj = "latest"
pre-commit = "latest"
"npm:difit" = "latest"
"npm:hunkdiff" = "latest"

# [tools.shells]
shellcheck = "latest"
neovim = "latest"
peco = "latest"
# ssh extra + psycopg2-binary(PostgreSQL) / PyMySQL(MySQL) ドライバを注入
"pipx:sqlit-tui" = { version = "latest", extras = "ssh", uvx_args = "--with psycopg2-binary --with PyMySQL" }
"npm:backlog.md" = "latest"

# [tools.json]
jq = "latest"

# [tools.yaml]
yq = "latest"
"pipx:yamllint" = "latest"

# [tools.ansible]
"pipx:ansible-lint" = "latest"

# [tools.rust]
rust = "latest"
"github:crate-ci/cargo-release" = "latest"

# [tools.ai]
herdr = "latest"
"github:yusukebe/ax" = "latest"
"npm:@openai/codex" = "latest"
"npm:@drawio/mcp" = "latest"

# [tools.ai.skills]
# hunk-review は入れない: ~/.claude/skills/hunk-review は自作ローダー(mise [dotfiles])で、
# npm:hunkdiff の版に合わせてある。
"skill:herdrdev/herdr" = { version = "latest", skills = ["herdr"] }
"skill:vercel-labs/skills" = { version = "latest", skills = ["find-skills"] }
"skill:yusukebe/ax" = { version = "latest", skills = ["ax"] }
"skill:ast-grep/agent-skill" = { version = "ref:main", skills = ["ast-grep", "ast-grep-outline"] }
"skill:coji/natural-japanese" = "latest"
"skill:nanaism/yomiyasu" = "latest"

# [tools.testing]
"npm:playwright" = "latest"

# [tools.hashicorp]
terraform = "latest"
opentofu = "latest"
packer = "latest"

# [tools.network]
cloudflared = "latest"

# [tools.cli]
ripgrep = "latest"
ast-grep = "latest"
fd = "latest"
fzf = "latest"
eza = "latest"
bat = "latest"
zoxide = "latest"
ghq = "latest"
# zsh plugins (~/.config/sheldon/plugins.toml); ~/.zshrc runs `sheldon source`
sheldon = "latest"
"github:kukv/octoscope" = "latest"

# [tools.aws]
aws-cli = { version = "latest", symlink_bins = "true" }
aws-sam = { version = "latest", symlink_bins = "true" }
"npm:aws-cdk" = "latest"

# [tools.localstack]
"pipx:awscli-local" = "latest"
"npm:aws-cdk-local" = "latest"
