# Managed by chezmoi — edit with: chezmoi edit ~/.config/mise/config.toml
# ==========================================================================
# settings
# ==========================================================================
[settings]
experimental = true
# .node-version 等の言語固有バージョンファイルを読まない (mise.toml で一元管理)
idiomatic_version_file_enable_tools = []

[settings.npm]
package_manager = "pnpm"

[settings.pipx]
uvx = true

# ==========================================================================
# env
# ==========================================================================
[env]
# Ruby をソースからビルドせずプリコンパイル済みバイナリを使う
MISE_RUBY_COMPILE = "0"

# ==========================================================================
# packages
# ==========================================================================
[tools]
# [tools.jvm]
java = [
    "openjdk-25",
    "openjdk-21",
    "openjdk-17",
]
gradle = "latest"
maven = "latest"
kotlin = "latest"

# [tools.node]
node = [
    "24",
    "22",
]
pnpm = "latest"
bun = "latest
"npm:yarn" = "latest"

# [tools.python]
python = "3.14"
uv = "latest"

# [tools.ruby]
ruby = [ "4", "3" ]

# [tools.go]
go = "latest"
golangci-lint = "latest"
gomigrate = "latest"
gotestsum = "latest"
skeema = "latest"

# [tools.kubernetes]
kubectl = "latest"
helm = "latest"
helmfile = "latest"
k3d = "latest"
cmctl = "latest"
argo = "latest"
k9s = "latest"
kustomize = "latest"
kubeconform = "latest"
conftest = "latest"
flux2 = "latest"
stern = "latest"

# [tools.vcs]
github-cli = "latest"
lazygit = "latest"
act = "latest"
action-validator = "latest"
actionlint = "latest"
jj = "latest"
pre-commit = "latest"
"npm:difit" = "latest"
"npm:hunkdiff" = "latest"

# [tools.shells]
shellcheck = "latest"
neovim = "latest"
peco = "latest"
# ssh extra + psycopg2-binary(PostgreSQL) / PyMySQL(MySQL) ドライバを注入
"pipx:sqlit-tui" = { version = "latest", extras = "ssh", uvx_args = "--with psycopg2-binary --with PyMySQL" }
"npm:backlog.md" = "latest"

# [tools.json]
jq = "latest"

# [tools.yaml]
yq = "latest"
"pipx:yamllint" = "latest"

# [tools.ansible]
"pipx:ansible-lint" = "latest"

# [tools.rust]
rust = "latest"
"ubi:crate-ci/cargo-release" = "latest"

# [tools.ai]
herdr = "latest"
"npm:@openai/codex" = "latest"
"npm:@drawio/mcp" = "latest"

# [tools.testing]
"npm:playwright" = "latest"

# [tools.hashicorp]
terraform = "latest"
opentofu = "latest"
packer = "latest"

# [tools.network]
cloudflared = "latest"

# [tools.cli]
ripgrep = "latest"
fd = "latest"
fzf = "latest"
eza = "latest"
bat = "latest"
zoxide = "latest"
ghq = "latest"

# [tools.aws]
aws-cli = { version = "latest", symlink_bins = "true" }
aws-sam = { version = "latest", symlink_bins = "true" }
"npm:aws-cdk" = "latest"

# [tools.localstack]
"pipx:awscli-local" = "latest"
"npm:aws-cdk-local" = "latest"
