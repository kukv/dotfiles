onboarding = false

[ui]
agent_panel_sort = "spaces"

[experimental]
# TUI がカーソルを隠していても、IME が候補ウィンドウの位置を追えるように外側のターミナルへカーソル位置を公開する
reveal_hidden_cursor_for_cjk_ime = true

# 上の設定を適用するエージェント（フォーカス中のペインで判定）
cjk_ime_agents = ["claude", "codex"]

# IME 用に表示するカーソルの形状
cjk_ime_cursor_shape = "steady_block"

# prefix モードの間だけ macOS の入力ソースを ASCII 系に切り替え、抜けたら元の入力ソースに戻す
switch_ascii_input_source_in_prefix = true

# --- キーバインド ---
# アプリ・プラグイン起動系は prefix+shift+英字 に統一（prefix+英字 単体はデフォルトの
# ペイン移動 h/j/k/l などと衝突しやすく、alt は iTerm2 の Option 設定に依存するため）。
# shift+g は new_worktree で使用済みのため github-dash のみ ctrl+g。prefix+f は空きキーなのでそのまま。
# shell コマンドはフォーカス中ペインの cwd で実行され、HERDR_ACTIVE_* 環境変数を受け取る。

# herdr-file-viewer: prefix+f で別タブ起動（既にタブがあればそこへ切り替え）
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "Open file viewer in tab"

# neovim: prefix+shift+e で現在のペインのディレクトリ（ワークツリー）を別タブで開く。
# tab.create はコマンド指定不可のため、agent start（現タブに split）→ pane move --new-tab で別タブ化する。
# "$$" で起動ごとに一意な名前にする（agent 名は重複不可）。
[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = 'p=$(herdr agent start "nvim-$$" --cwd "$HERDR_ACTIVE_PANE_CWD" --no-focus -- nvim | jq -r .result.agent.pane_id) && herdr pane move "$p" --new-tab --label nvim --focus'
description = "Open neovim in new tab"

# sqlit: prefix+shift+s で別タブ起動（neovim と同じ方式）
[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = 'p=$(herdr agent start "sqlit-$$" --cwd "$HERDR_ACTIVE_PANE_CWD" --no-focus -- sqlit | jq -r .result.agent.pane_id) && herdr pane move "$p" --new-tab --label sqlit --focus'
description = "Open sqlit in new tab"

# lazygit: prefix+shift+l で popup 起動
[[keys.command]]
key = "prefix+shift+l"
type = "popup"
command = "lazygit"
description = "Open lazygit in popup"
width = "85%"
height = "85%"

# herdr-plugin-hunk: prefix+shift+h で worktree diff（アクション自体が split で開く）
# prefix+h はデフォルトの focus_pane_left と衝突するため shift を付けている。
[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "hunk.diff.worktree-split"
description = "Open worktree diff in split pane"

# github-dash: prefix+ctrl+g で GitHub ダッシュボード（アクション自体が overlay で開く）
[[keys.command]]
key = "prefix+ctrl+g"
type = "plugin_action"
command = "kukv.github-dash.open"
description = "Open GitHub dashboard"
