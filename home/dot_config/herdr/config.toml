onboarding = false

[theme]
name = "rose-pine"
auto_switch = false

[ui]
agent_panel_sort = "spaces"
status_indicators = "dots"
show_agent_labels_on_pane_borders = true

# エージェント行に状態テキスト（idle / done など）を表示する。
# デフォルトの rows は state_icon（色付きドット）のみで state_text を含まない。
[ui.sidebar.agents]
rows = [["state_icon", "state_text"], ["workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

# アプリ内トーストではなく OS の通知センターに出す（別ウィンドウにいても気づける）
[ui.toast]
delivery = "system"

[ui.sound]
enabled = true

[experimental]
# experimental graphics を有効化
# herdr browserで利用
kitty_graphics = true

# TUI がカーソルを隠していても、IME が候補ウィンドウの位置を追えるように外側のターミナルへカーソル位置を公開する
reveal_hidden_cursor_for_cjk_ime = true

# 上の設定を適用するエージェント（フォーカス中のペインで判定）
cjk_ime_agents = ["claude", "codex"]

# IME 用に表示するカーソルの形状
cjk_ime_cursor_shape = "steady_block"

# prefix モードの間だけ macOS の入力ソースを ASCII 系に切り替え、抜けたら元の入力ソースに戻す
switch_ascii_input_source_in_prefix = true

[keys]
# 組み込みの new_tab は起点ペインの foreground_cwd を継承するため、claude -w が作った
# worktree の中でタブが開いてしまう。無効化して、下の prefix+c に置き換える。
new_tab = ""

# 直前のペインと往復（tmux 相当）。デフォルトの cycle_pane_next が同じ prefix+tab を
# 使っているため、どちらが勝つかは未定義。意図を明示するため cycle_pane_next を外す。
# ペイン間移動は prefix+h/j/k/l があるので実用上の損失はない。
last_pane = "prefix+tab"
cycle_pane_next = ""

# 新しいタブ: prefix+c で「worktree 元（メインのワークツリー）」を cwd にして開く。
# git worktree list の先頭は必ずメインのワークツリーなので、起点が worktree 側でも
# リポジトリルート側でも同じ結果になる。git 管理外なら起点の cwd にフォールバック。
# 引き換えに herdr 標準のタブ名入力プロンプト（prompt_new_tab_name）は出ず、自動生成名になる。
[[keys.command]]
key = "prefix+c"
type = "shell"
command = 'd="${HERDR_ACTIVE_PANE_CWD:-$PWD}"; root=$(git -C "$d" worktree list --porcelain 2>/dev/null | head -1 | cut -d" " -f2-); herdr tab create --cwd "${root:-$d}" --focus'
description = "New tab at main worktree"

# --- アプリ・プラグイン起動 ---
# 起動系は prefix+shift+英字 に統一（prefix+英字 単体はデフォルトの
# ペイン移動 h/j/k/l などと衝突しやすく、alt は iTerm2 の Option 設定に依存するため）。
# shift+g は new_worktree で使用済みのため github-dash のみ ctrl+g。prefix+f は空きキーなので nvim に割当。

# neovim: prefix+f で popup 起動。
# 引数 "." がないと LazyVim はダッシュボードを表示するため、cwd をエクスプローラーで開く。
# popup に cwd を指定する口はないが、実測では起点ペインのシェルの cwd（claude -w 中でも
# worktree ではなくリポジトリルート）で開くため、タブ方式のときと同じ場所になる。
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "nvim ."
description = "Open neovim in popup"
width = "85%"
height = "85%"

# herdr-file-viewer: prefix+shift+e で別タブ起動（既にタブがあればそこへ切り替え）
[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "Open file viewer in tab"

# sqlit: prefix+shift+s で popup 起動（neovim と同じ方式）
[[keys.command]]
key = "prefix+shift+s"
type = "popup"
command = "sqlit"
description = "Open sqlit in popup"
width = "85%"
height = "85%"

# lazygit: prefix+shift+l で popup 起動
[[keys.command]]
key = "prefix+shift+l"
type = "popup"
command = "lazygit"
description = "Open lazygit in popup"
width = "85%"
height = "85%"

# herdr-plugin-hunk: prefix+shift+h で worktree diff（アクション自体が split で開く）
# prefix+h はデフォルトの focus_pane_left と衝突するため shift を付けている。
[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "hunk.diff.worktree-split"
description = "Open worktree diff in split pane"

# github-dash: prefix+ctrl+g で GitHub ダッシュボード（アクション自体が overlay で開く）
[[keys.command]]
key = "prefix+ctrl+g"
type = "plugin_action"
command = "kukv.github-dash.open"
description = "Open GitHub dashboard"
