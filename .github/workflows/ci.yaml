name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: shellcheck bootstrap scripts
        if: runner.os == 'Linux'
        run: git ls-files -z 'bootstrap/*.sh' 'tests/bootstrap/*.sh' | xargs -0 -r shellcheck

      - name: mise bootstrap plan (every machine selection)
        run: tests/bootstrap/plan.sh

      - name: dotfiles (every machine selection)
        run: tests/bootstrap/dotfiles.test.sh

      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: zsh startup (sheldon plugins)
        run: tests/bootstrap/zsh.test.sh

      - name: init.sh
        run: tests/bootstrap/init.test.sh
