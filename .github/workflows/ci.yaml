name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  apply:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Seed chezmoi data (git identity)
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          cat > "$HOME/.config/chezmoi/chezmoi.toml" <<'EOF'
          [data]
              git_name = "CI User"
              git_email = "ci@example.com"
              use_1password = true
          EOF

      - name: chezmoi apply to throwaway destination
        run: |
          DEST="$(mktemp -d)"
          "$HOME/.local/bin/chezmoi" apply \
            --source "$GITHUB_WORKSPACE" \
            --destination "$DEST" \
            --no-tty --verbose
          echo "DEST=$DEST" >> "$GITHUB_ENV"

      # `chezmoi apply` above is the primary gate: it fails on any broken
      # template, missing data, or broken external. The checks below only cover
      # what apply-success cannot: that templating rendered with seeded data,
      # the alien theme's git submodules were fetched (a known footgun — archive
      # tarballs omit them), and that the OS-conditional signer/ssh routing does
      # not cross-contaminate. Do NOT add "file X exists / value Y present"
      # assertions here — apply-success already covers those.
      - name: Assert templating + externals
        run: |
          grep -q 'name = CI User' "$DEST/.gitconfig"
          test -f "$DEST/.oh-my-zsh/custom/themes/alien/libs/promptlib/activate"

      - name: Assert native Linux ssh routing (no WSL, no macOS)
        if: runner.os == 'Linux'
        run: |
          # ubuntu-latest is native Linux, not WSL. WSL-only routing is gated on the
          # kernel string (…microsoft…), so it must be ABSENT here. GitHub has no WSL
          # runner, so "WSL routing present" is intentionally NOT covered by CI.
          if grep -q "alias ssh='ssh.exe'" "$DEST/.zshrc"; then echo 'WSL ssh alias leaked into native Linux zshrc' >&2; exit 1; fi
          if grep -q 'sshCommand = ssh.exe' "$DEST/.gitconfig"; then echo 'WSL sshCommand leaked into native Linux gitconfig' >&2; exit 1; fi
          if grep -q 'op-ssh-sign-wsl.exe' "$DEST/.gitconfig"; then echo 'WSL signer leaked into native Linux gitconfig' >&2; exit 1; fi
          if grep -q 'MacOS/op-ssh-sign' "$DEST/.gitconfig"; then echo 'macOS signer leaked into Linux gitconfig' >&2; exit 1; fi
          test ! -f "$DEST/.ssh/config"

      - name: chezmoi apply — local-key (no 1Password) variant
        if: runner.os == 'Linux'
        run: |
          # Exercise the use_1password=false branch: local signing key instead of
          # 1Password. The key lives at the template's default path
          # (~/.ssh/git_signing_key.pub) and git_signing_key_file is left unset, so this
          # also covers the default. apply-success gates the new template paths
          # (signingkey-as-file, allowedSignersFile, allowed_signers via stat/output).
          # The two greps only cover what apply cannot: that the 1Password signer does
          # not leak in, and that allowed_signers is actually generated from the key.
          mkdir -p "$HOME/.ssh"
          ssh-keygen -t ed25519 -f "$HOME/.ssh/git_signing_key" -N "" -q
          cat > "$HOME/.config/chezmoi/chezmoi.toml" <<EOF
          [data]
              git_name = "CI User"
              git_email = "ci@example.com"
              use_1password = false
          EOF
          DEST2="$(mktemp -d)"
          "$HOME/.local/bin/chezmoi" apply \
            --source "$GITHUB_WORKSPACE" \
            --destination "$DEST2" \
            --no-tty --verbose
          if grep -q 'op-ssh-sign' "$DEST2/.gitconfig"; then echo '1Password signer leaked into local-key gitconfig' >&2; exit 1; fi
          grep -q 'ci@example.com ssh-ed25519' "$DEST2/.ssh/allowed_signers"

      - name: Assert macOS signer + ssh routing
        if: runner.os == 'macOS'
        run: |
          ! grep -q "alias ssh='ssh.exe'" "$DEST/.zshrc"
          # macOS signs commits via the local 1Password app bundle
          grep -q 'MacOS/op-ssh-sign' "$DEST/.gitconfig"
          if grep -q 'op-ssh-sign-wsl.exe' "$DEST/.gitconfig"; then echo 'WSL signer leaked into macOS gitconfig' >&2; exit 1; fi
          test -f "$DEST/.ssh/config"
