name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the mise binary: the tests run mise themselves (install / env / cache off).
      - name: Install mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.*)$
          version: 2026.10.12
          install: false
          cache: false
          env: false
          export_path: false

      - name: shellcheck bootstrap scripts
        if: runner.os == 'Linux'
        run: git ls-files -z 'bootstrap/*.sh' 'tests/bootstrap/*.sh' | xargs -0 -r shellcheck

      - name: mise bootstrap plan (every machine selection)
        run: tests/bootstrap/plan.sh

      - name: dotfiles (every machine selection)
        run: tests/bootstrap/dotfiles.test.sh

      - name: Install zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          # The runner's umask can leave /usr/share/zsh group-writable, which makes
          # compaudit flag it and compinit prompt; show it, then make it root-only-writable.
          ls -ld /usr/share/zsh /usr/share/zsh/vendor-completions
          sudo chmod go-w /usr/share/zsh /usr/share/zsh/vendor-completions

      - name: zsh startup (sheldon plugins)
        run: tests/bootstrap/zsh.test.sh

      - name: init.sh
        run: tests/bootstrap/init.test.sh
