# mise bootstrap project for kukv/dotfiles.
# Base: settings every machine shares. OS differences live in mise.{linux,macos}.toml,
# machine roles in modules (mise.wsl.toml, mise.work.toml) selected per machine in
# ~/.config/mise/miserc.local.toml. See docs/superpowers/specs/2026-10-15-mise-bootstrap-migration-design.md

# ==========================================================================
# vars (per-machine answers are saved by `mise bootstrap --prompt-vars`)
# git_name / git_email default to "" so other mise commands work without answers;
# The pre-dotfiles hook fails if they are still empty.
# ==========================================================================
[vars.git_name]
prompt = "Git user.name"
default = ""

[vars.git_email]
prompt = "Git user.email"
default = ""

# Overridden to "false" by mise.work.toml (company PC signs with a local key).
[vars.use_1password]
default = "true"

# Empty: home/.gitconfig.tera falls back to ~/.ssh/git_signing_key.pub.
[vars.git_signing_key_file]
default = ""

# ==========================================================================
# dotfiles (copied / rendered into ~ by the dotfiles step, before tools).
# Sources live in home/ under their real names; *.tera files are templates.
# ==========================================================================
[dotfiles]
"~/.claude" = { source = "home/.claude", mode = "copy" }
"~/.codex/config.toml" = { source = "home/.codex/config.toml", mode = "copy" }
"~/.config/git/ignore" = { source = "home/.config/git/ignore", mode = "copy" }
"~/.config/herdr/config.toml" = { source = "home/.config/herdr/config.toml", mode = "copy" }
"~/.config/mise/config.toml" = { source = "home/.config/mise/config.toml", mode = "copy" }
# chezmoi never deployed these (it ignores dot-prefixed sources); keep it that way.
"~/.config/nvim" = { source = "home/.config/nvim", mode = "copy", exclude = ["/.gitignore", "/.neoconf.json"] }
"~/Library/Application Support/iTerm2/DynamicProfiles/default_profile.json" = { source = "home/Library/Application Support/iTerm2/DynamicProfiles/default_profile.json", mode = "copy", variants = [{ os = "macos" }] }

# ==========================================================================
# bootstrap task (runs last in `mise bootstrap`, with [tools] on PATH)
# ==========================================================================
[tasks.bootstrap]
description = "Post-tools setup: corepack, herdr plugins, Claude skills, Claude Code"
run = ["'{{ config_root }}/bootstrap/post-tools.sh'"]
